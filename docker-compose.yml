version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: pg
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672" # AMQP protocol port
      - "15672:15672" # Management UI port
    restart: always # Optional: auto-restart if container crashes
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 5s
      timeout: 10s
      retries: 5

  backend-api:
    build:
      context: ./apps/backend/api
      dockerfile: Dockerfile
    container_name: backend-api
    env_file:
      - ./apps/backend/api/.env # 👈 Specific to this service
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq
    restart: unless-stopped

  generator-worker:
    build:
      context: ./apps/backend/generator-service
    container_name: generator-worker
    depends_on:
      - postgres
      - rabbitmq
      - backend-api
    env_file:
      - ./apps/backend/generator-service/.env # Specific to this service
    # restart: always
    restart: on-failure

  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        # NEXT_PUBLIC_API_BASE_URL: http://backend-api:8080
        # NEXT_PUBLIC_API_BASE_URL: http://3.104.128.100:8080
    container_name: frontend
    ports:
      - "80:3000" # Only expose on port 80 for HTTP
    depends_on:
      - backend-api
    restart: on-failure

volumes:
  pgdata:


